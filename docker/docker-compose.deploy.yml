# Production stack pulled by CI/CD onto a single droplet. The app runs the
# prebuilt GHCR image (GitHub Actions builds + pushes it); Caddy terminates TLS
# for doot.games and reverse-proxies the app. State is a SQLite file on the host
# (./data), which persists across deploys - the cheapest single-droplet setup.
# Secrets come from /opt/doot/.env (written at provision time, never in git).

# Every service rotates its json logs so a chatty container can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    # The deploy job sets DOOT_IMAGE_TAG to the commit sha it is shipping, so the
    # previous sha is still on disk to roll back to. A manual `docker compose up -d`
    # without it falls back to :latest (= the most recent successful build).
    image: ghcr.io/virgilvox/doot-games:${DOOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Production must boot on the EXISTING database; refuse to start on a missing
      # or empty file rather than silently create a blank one (see db.ts).
      DOOT_REQUIRE_EXISTING_DB: '1'
    # Headroom over the ~250MB it idles at on the 1GB droplet, but capped so a
    # runaway request can't push the box into swap death; it restarts instead.
    mem_limit: 700m
    logging: *logging
    volumes:
      - ./data:/app/.data
    expose:
      - '3000'

  # Privacy-friendly web analytics (GoatCounter): a single Go binary on its own
  # SQLite file under ./data/goatcounter, so it shares the app's persistence
  # story and adds no extra database. Caddy terminates TLS and serves it at
  # stats.doot.games (see the Caddyfile). Memory-capped so it can't starve the
  # app on a small droplet (it idles at ~25-50MB). Tracking only switches on once
  # NUXT_PUBLIC_GOATCOUNTER_URL is set in the app's env (see docs/deploy.md); the
  # dashboard is reachable as soon as you create the first site.
  goatcounter:
    image: arp242/goatcounter:2.7.0
    restart: unless-stopped
    command: ['serve', '-listen=:8080', '-tls=none', '-automigrate']
    mem_limit: 128m
    logging: *logging
    volumes:
      - ./data/goatcounter:/home/goatcounter/goatcounter-data
    expose:
      - '8080'

  caddy:
    # Pinned by digest (the image prod already runs) so a deploy never silently
    # picks up a new Caddy; bump deliberately.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
